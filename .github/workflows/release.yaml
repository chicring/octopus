name: release

on:
  push:
    branches:
      - dev
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOCKER_IMAGE: chruxc/octopus

jobs:
  # tag push 时：生成 changelog + 合并 dev → master
  changelog:
    name: changelog
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.ACTION_TOKEN }}

      - name: Generate changelog
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_TOKEN }}

      - name: Merge dev to master
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions@github.com'
          if ! git show-ref --verify --quiet refs/heads/master; then
            git checkout -b master
          else
            git checkout master
          fi
          git fetch origin dev
          git merge origin/dev
          git remote set-url origin https://x-access-token:${{ secrets.ACTION_TOKEN }}@github.com/${{ github.repository }}
          git push origin master --force

  # tag push 时：构建 + 发布 Release + Docker latest
  # dev push 时：只构建 Docker dev 镜像
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [changelog]
    if: always()  # dev push 时 changelog 被跳过，但 build 仍需运行
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 'latest'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Get version info
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            LATEST_TAG="${GITHUB_REF_NAME}"
          else
            CURRENT_TAGS=$(git tag --points-at HEAD 2>/dev/null | sort -V | tail -1)
            if [ -n "$CURRENT_TAGS" ]; then
              LATEST_TAG="$CURRENT_TAGS"
            else
              LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo 'dev')
            fi
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag_name=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "OCTOPUS_VERSION=$LATEST_TAG" >> $GITHUB_ENV

      - name: Build
        run: bash scripts/build.sh release

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/archives/*
          prerelease: false
          tag_name: ${{ steps.tag.outputs.tag_name }}

      - name: Docker meta (Debian)
        id: meta-debian
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ steps.tag.outputs.tag_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ steps.tag.outputs.short_sha }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Docker meta (Alpine)
        id: meta-alpine
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest-alpine,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ steps.tag.outputs.tag_name }}-alpine,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ steps.tag.outputs.short_sha }}-alpine
            type=raw,value=dev-alpine,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (Alpine)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./scripts/dockerfiles/Dockerfile.alpine
          push: true
          platforms: linux/amd64,linux/i386,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta-alpine.outputs.tags }}
          labels: ${{ steps.meta-alpine.outputs.labels }}
          build-args: |
            TARGETPLATFORM

      - name: Build and push (Debian)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./scripts/dockerfiles/Dockerfile.debian
          push: true
          platforms: linux/amd64,linux/i386,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta-debian.outputs.tags }}
          labels: ${{ steps.meta-debian.outputs.labels }}
          build-args: |
            TARGETPLATFORM
